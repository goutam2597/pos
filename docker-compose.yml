services:
  postgres:
    image: postgres:16-alpine
    container_name: monopos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: monopos
      POSTGRES_PASSWORD: monopos
      POSTGRES_DB: monopos
      # Monotonic clock + checksums; money math is done in the app with integers anyway.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Host port 5432 is already taken on this machine by another project's
      # Postgres, so MonoPOS publishes on 5434. Change both this mapping and
      # DATABASE_URL together if you need a different one.
      - "5434:5432"
    volumes:
      - monopos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monopos -d monopos"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  monopos-pgdata:
